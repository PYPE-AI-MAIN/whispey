name: Clients Production Deployment

on:
  push:
    branches:
      - develop
      - develop-new
      - main
      - main-new

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  DEPLOY_ENV: ${{ (github.ref_name == 'main' || github.ref_name == 'main-new') && 'production' || 'develop' }}

jobs:
  test-gate:
    name: Lint, Test, Secret Scan & Sonar Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Detect Secrets
        run: ./gitleaks detect --source . --redact --exit-code 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-push:
    needs: test-gate
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' || github.ref_name == 'main-new') && 'production' || 'develop' }}

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image details
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

          echo "Image URI: ${IMAGE_URI}"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login \
              --username AWS \
              --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
          || aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One build-and-push: layers are cached across runs in the GitHub Actions cache,
      # so the npm ci layer is rebuilt only when package-lock.json changes, and the
      # image is pushed straight from the builder (no separate docker push / unpack).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_AGENT_CREATION_WHITELIST=${{ secrets.NEXT_PUBLIC_AGENT_CREATION_WHITELIST }}
            NEXT_PUBLIC_POSTHOG_BLACKLIST=${{ secrets.NEXT_PUBLIC_POSTHOG_BLACKLIST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_SONIC_LINKER_ORG_ID=${{ secrets.NEXT_PUBLIC_SONIC_LINKER_ORG_ID }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MONITORING_SERVICE_BASE_URL=${{ secrets.NEXT_PUBLIC_MONITORING_SERVICE_BASE_URL }}
            NEXT_PUBLIC_MONITORING_AGENT_BASE_URL=${{ secrets.NEXT_PUBLIC_MONITORING_AGENT_BASE_URL }}
            NEXT_PUBLIC_PYPEAI_API_URL=${{ secrets.NEXT_PUBLIC_PYPEAI_API_URL }}
            NEXT_PUBLIC_DISPOSITION_PROJECTS=${{ secrets.NEXT_PUBLIC_DISPOSITION_PROJECTS }}
            NEXT_PUBLIC_METABASE_URL=${{ secrets.NEXT_PUBLIC_METABASE_URL }}
            NEXT_PUBLIC_FEEDBACK_URL=${{ secrets.NEXT_PUBLIC_FEEDBACK_URL }}
            NEXT_PUBLIC_X_API_KEY=${{ secrets.NEXT_PUBLIC_X_API_KEY }}
            NEXT_PUBLIC_API_BASE_URL_CAMPAIGN=${{ secrets.NEXT_PUBLIC_API_BASE_URL_CAMPAIGN }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
            NEXT_PUBLIC_API_BASE_URL_SEND_CALL_LOG_LAMBDA=${{ secrets.NEXT_PUBLIC_API_BASE_URL_SEND_CALL_LOG_LAMBDA }}
            NEXT_PUBLIC_API_BASE_URL_OLD_CAMPAIGN=${{ secrets.NEXT_PUBLIC_API_BASE_URL_OLD_CAMPAIGN }}
            NEXT_PUBLIC_REPROCESS_API_BASE_URL=${{ secrets.NEXT_PUBLIC_REPROCESS_API_BASE_URL }}

  deploy:
    environment: ${{ (github.ref_name == 'main' || github.ref_name == 'main-new') && 'production' || 'develop' }}
    name: Deploy to Private EC2 using Blue Green
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR on EC2 instance
        run: |
          INSTANCE_ID="${{ secrets.PRIVATE_INSTANCE_ID }}"

          aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '"${AWS_REGION}"' | docker login --username AWS --password-stdin '"${AWS_ACCOUNT_ID}"'.dkr.ecr.'"${AWS_REGION}"'.amazonaws.com"
            ]' \
            --region "${AWS_REGION}"

      - name: Trigger blue green deployment through SSM
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          INSTANCE_ID="${{ secrets.PRIVATE_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Frontend blue green deploy - ${IMAGE_TAG}" \
            --parameters commands='[
              "set -e",
              "echo Starting blue green deployment",
              "sudo /opt/frontend/deploy.sh '"${IMAGE_URI}"' '"${IMAGE_TAG}"'"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: ${COMMAND_ID}"
          echo "Waiting for deployment to finish..."

          while true; do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}")

            STATUS=$(echo "${RESULT}" | jq -r '.StatusDetails')

            echo "Current Status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              break
            fi

            if [ "${STATUS}" = "Failed" ] || \
               [ "${STATUS}" = "Cancelled" ] || \
               [ "${STATUS}" = "TimedOut" ] || \
               [ "${STATUS}" = "ExecutionTimedOut" ]; then
              break
            fi

            sleep 10
          done
                    echo "========== FULL SSM RESPONSE =========="
          echo "${RESULT}"
          echo "======================================="

          STDOUT=$(echo "${RESULT}" | jq -r '.StandardOutputContent')
          STDERR=$(echo "${RESULT}" | jq -r '.StandardErrorContent')

          echo "Deployment Status: ${STATUS}"

          echo "========== STDOUT =========="
          echo "${STDOUT}"

          echo "========== STDERR =========="
          echo "${STDERR}"

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment failed"
            exit 1
          fi

          echo "Deployment completed successfully"
